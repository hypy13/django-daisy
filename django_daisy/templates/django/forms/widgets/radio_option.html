{% load dash_tags %}
{% with widget=widget|apply_class_to_widget:'radio radio-sm focus:outline-0 transition-all focus:outline-offset-0' %}
    <label{% if widget.attrs.id %} for="{{ widget.attrs.id }}"{% endif %}
           class="inline-flex cursor-pointer items-center gap-2 px-1 py-1">
        <input type="radio" name="{{ widget.name }}" {% if widget.value != None %}
               value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>
        <span>{{ widget.label }}</span>
    </label>
{% endwith %}
